x-tools-image: &tools-image ${TOOL_IMAGE:-ghcr.io/sogis/dateninfrastruktur-tools:0.2.28}

services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/sogis/dateninfrastruktur-admin:0.2.28}
    profiles: [container-admin]
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/sogis/dateninfrastruktur-postgres:0.2.28}
    build: !reset null
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
  origin:
    ports:
      - "127.0.0.1:${ORIGIN_HOST_PORT:-18090}:8080"
  superset:
    image: ${SUPERSET_IMAGE:-ghcr.io/sogis/dateninfrastruktur-superset:0.2.28}
    build: !reset null
  sodata:
    image: ${SODATA_IMAGE:-ghcr.io/sogis/dateninfrastruktur-sodata-jvm:0.1.10}
    build: !reset null
  jenkins:
    image: ${JENKINS_IMAGE:-ghcr.io/sogis/dateninfrastruktur-jenkins:0.2.28}
    depends_on: !override
      keycloak:
        condition: service_healthy
    extra_hosts:
      admin: host-gateway
  management-setup:
    image: *tools-image
  postgres-init:
    image: *tools-image
  garage-setup:
    image: *tools-image
  management-tool-build:
    image: *tools-image
  gateway:
    depends_on: !override
      sodata:
        condition: service_healthy
      origin:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    extra_hosts:
      admin: host-gateway
