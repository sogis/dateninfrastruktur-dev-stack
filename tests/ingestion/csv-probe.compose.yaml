services:
  csv-probe:
    image: ${G0_JENKINS_IMAGE:?verified GRETL image}
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        export JAVA_HOME=/opt/java/openjdk17;
        export PATH="$$JAVA_HOME/bin:$$PATH";
        cd /probe;
        /source/gradlew --offline --no-daemon --project-cache-dir /work/cache
        --build-file /probe/build.gradle -Pinput=/work/input.csv validateCsv
    volumes:
      - ${G0_PROBE_DIR}:/probe:ro
      - ${G0_WORK_DIR}:/work
      - ${G0_TOPICS_DIR}:/source:ro
    labels:
      di.probe: ma-g0-csv
