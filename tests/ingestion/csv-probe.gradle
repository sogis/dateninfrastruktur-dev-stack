// Test-only risk probe. Uses the actual bundled GRETL implementation.
buildscript { dependencies { classpath fileTree('/opt/datenportal/offline-bundle/jars') { include '*.jar' } } }
import ch.so.agi.gretl.tasks.CsvValidator
import groovy.json.JsonOutput

def source = file(providers.gradleProperty('input').get())
tasks.register('validateCsv', CsvValidator) {
    dataFiles source
    modelNames 'SO_Bevoelkerung_Altersstruktur_20261015'
    modelDirectories '/probe/models'
    firstLineIsHeader.set(true)
    valueSeparator.set(';')
    valueDelimiter.set('"')
    encoding.set('UTF-8')
    failOnError.set(true)
    logFile file('/work/validator.log')
    doFirst {
        if (!source.isFile() || source.length() == 0) throw new GradleException('Missing input')
        if (getDataFiles() == null || getDataFiles().isEmpty()) throw new GradleException('No validator inputs')
    }
    doLast {
        if (!validationOk) throw new GradleException('Validator did not confirm validation')
        def jars=fileTree('/opt/datenportal/offline-bundle/jars').matching { include '*.jar' }.files.sort { it.name }.collectEntries { f ->
            [(f.name):java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()]
        }
        file('/work/validated.json').text = JsonOutput.toJson([validator:CsvValidator.name,executed:true,validationOk:validationOk,jars:jars])
    }
}
