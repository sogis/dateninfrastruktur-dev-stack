services:
  admin:
    profiles: [container-admin]
  postgres:
    build: !reset null
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
  origin:
    ports:
      - "127.0.0.1:${ORIGIN_HOST_PORT:-18090}:8080"
  superset:
    build: !reset null
  sodata:
    build: !reset null
  jenkins:
    depends_on: !override
      keycloak:
        condition: service_healthy
    extra_hosts:
      admin: host-gateway
  gateway:
    depends_on: !override
      sodata:
        condition: service_healthy
      origin:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    extra_hosts:
      admin: host-gateway
