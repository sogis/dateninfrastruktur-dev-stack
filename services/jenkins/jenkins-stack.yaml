# One Compose Jenkins controller and one fixed CSV pipeline provisioned by the plugin.
jenkins:
  systemMessage: 'Dateninfrastruktur – CSV-Anlieferung'
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    oic:
      clientId: jenkins-delivery
      clientSecret: '${DI_JENKINS_OIDC_CLIENT_SECRET}'
      userNameField: sub
      fullNameFieldName: name
      emailFieldName: email
      rootURLFromRequest: false
      allowTokenAccessWithoutOicSession: false
      tokenExpirationCheckDisabled: false
      logoutFromOpenidProvider: true
      postLogoutRedirectUrl: '${JENKINS_URL}'
      serverConfiguration:
        manual:
          issuer: '${DI_JENKINS_ISSUER}'
          authorizationServerUrl: '${DI_JENKINS_AUTHORIZATION_URL}'
          tokenServerUrl: http://keycloak:8080/realms/dateninfrastruktur/protocol/openid-connect/token
          jwksServerUrl: http://keycloak:8080/realms/dateninfrastruktur/protocol/openid-connect/certs
          endSessionUrl: '${DI_JENKINS_LOGOUT_URL}'
          scopes: openid profile email
      properties:
        - pkce
        - escapeHatch:
            username: di-local-recovery
            group: di-local-recovery
            secret: '${JENKINS_ADMIN_PASSWORD}'
  authorizationStrategy:
    projectMatrix:
      entries:
        - group:
            name: authenticated
            permissions: ['Overall/Read']
        - user:
            name: di-csv-executor
            permissions: ['Agent/Build']
        - user:
            name: di-local-recovery
            permissions: ['Overall/Administer']
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: SYSTEM
              id: di-ingestion-plugin
              description: 'Internal delivery plugin proof'
              secret: '${DI_INGESTION_PLUGIN_SECRET}'
          - string:
              scope: SYSTEM
              id: di-ingestion-executor-client
              description: 'Dedicated Keycloak ingestion executor client'
              secret: '${DI_INGESTION_EXECUTOR_CLIENT_SECRET}'
          - string:
              scope: SYSTEM
              id: di-csv-storage-id
              description: 'Private CSV archive and distribution writer ID'
              secret: '${DI_STORAGE_WRITER_ACCESS_KEY}'
          - string:
              scope: SYSTEM
              id: di-csv-storage-secret
              description: 'Private CSV archive and distribution writer secret'
              secret: '${DI_STORAGE_WRITER_SECRET_KEY}'
          - string:
              scope: SYSTEM
              id: di-csv-clickhouse-loader
              description: 'Private ClickHouse candidate loader'
              secret: '${DI_CH_LOADER_PASSWORD}'
unclassified:
  location:
    url: '${JENKINS_URL}'
  diDelivery:
    backendBaseUri: 'http://admin:8080/internal/ingestion/'
    issuer: '${DI_JENKINS_ISSUER}'
    publicOrigin: '${DI_JENKINS_PUBLIC_ORIGIN}'
    instance: '${DI_JENKINS_INSTANCE}'
    maxUploadBytes: '${DI_INGESTION_MAX_UPLOAD_BYTES}'
