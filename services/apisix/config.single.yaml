{
  "apisix": {
    "node_listen": 9080,
    "enable_ipv6": false,
    "ssl": {
      "enable": false
    }
  },
  "deployment": {
    "role": "data_plane",
    "role_data_plane": {
      "config_provider": "yaml"
    }
  },
  "nginx_config": {
    "http_configuration_snippet": "add_header Cache-Control no-store always;",
    "worker_processes": 1,
    "error_log": "/dev/stderr",
    "http": {
      "access_log": "/dev/stdout",
      "access_log_format": "$remote_addr $uri $status"
    }
  }
}
